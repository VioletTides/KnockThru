# On pull requests and pushes to main: build and test on Linux, render the
# panel previews, then build and package for the Steam Frame. Catches a broken
# Frame build before a v* tag reaches release.yml. A second job runs the tests
# again under AddressSanitizer and UndefinedBehaviorSanitizer.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Pinned to the version that formatted the tree, because releases format differently.
      - name: Check formatting
        run: |
          pipx run clang-format==23.1.1 --dry-run --Werror $(git ls-files 'src/*.cpp' 'src/*.hpp' 'tests/*.cpp' 'tests/*.hpp' | grep -v -E 'logo_shapes|sprite_shapes')

      - name: Build and test
        run: |
          cmake -S . -B build
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Render the panel previews
        run: mkdir -p previews && build/bin/panel_preview previews

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: panel-previews
          path: previews/*.png

      - name: Install Zig 0.16.0
        run: |
          curl -sSfL -o zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  zig.tar.xz" | sha256sum -c
          mkdir zig && tar -xf zig.tar.xz -C zig --strip-components=1
          echo "$PWD/zig" >> "$GITHUB_PATH"

      - name: Build for the Steam Frame
        run: scripts/build-arm64.sh

      - name: Package
        run: python3 scripts/package.py --build-dir build-arm64 --version 0.0.0-ci

  sanitize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The hand-written SHA-256, ZIP writer, HTTP server, and WebSocket client all run in these tests.
      - name: Build and test with sanitizers
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
