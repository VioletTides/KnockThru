# On a v* tag: run the host tests, build for the Steam Frame, sign a build
# provenance attestation for the release files, and attach the ZIP, the
# FrameDrop manifest, and install.sh to a GitHub release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # for the attestation's signing certificate
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The host tests and the What's new check read the version from CMakeLists.txt.
      - name: Check the tag against CMakeLists.txt
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^project(KnockThru VERSION ${version%%-*} " CMakeLists.txt

      - name: Build and test
        run: |
          cmake -S . -B build
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Install Zig 0.16.0
        run: |
          curl -sSfL -o zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  zig.tar.xz" | sha256sum -c
          mkdir zig && tar -xf zig.tar.xz -C zig --strip-components=1
          echo "$PWD/zig" >> "$GITHUB_PATH"

      - name: Build for the Steam Frame
        run: KNOCKTHRU_VERSION="${GITHUB_REF_NAME#v}" scripts/build-arm64.sh

      - name: Package
        run: |
          python3 scripts/package.py --build-dir build-arm64 --version "${GITHUB_REF_NAME#v}" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/"
          cp scripts/install.sh dist/install.sh

      # Lets anyone check that a release file came from this workflow at this commit:
      # gh attestation verify <file> --repo VioletTides/KnockThru
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # The version's notes from whats-new.md go above the generated list of pull requests.
        run: |
          awk -v v="## ${GITHUB_REF_NAME#v}" '$0 == v {on = 1; next} /^## / {on = 0} on' assets/whats-new.md > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "KnockThru ${GITHUB_REF_NAME}" \
            --notes-file notes.md --generate-notes
